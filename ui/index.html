<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windhoek Ticketing</title>
  <link rel="icon" href="icons/ticket.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="scripts/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="main-header">
    <a class="brand" href="#routes"><img src="icons/ticket.svg" alt="" width="32" height="32">Windhoek Ticketing</a>
    <div class="header-actions">
      <button id="themeButton" type="button" aria-label="Switch to light theme">Light theme</button>
      <button id="authButton" type="button">Sign in</button>
    </div>
  </header>
  <div class="app-shell">
    <nav id="navigation" aria-label="Main navigation"></nav>
    <main id="main" tabindex="-1">
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="content" aria-busy="false"></div>
    </main>
  </div>
  <footer>Windhoek Ticketing · NAD · Payments are simulated for this university demo.</footer>
  <dialog id="authDialog" aria-labelledby="authTitle">
    <form id="authForm">
      <div class="dialog-heading"><h2 id="authTitle">Sign in</h2><button id="closeAuth" type="button" aria-label="Close sign in">Close</button></div>
      <p id="authError" role="alert"></p>
      <div id="registrationFields" hidden>
        <label>First name<input name="firstName" autocomplete="given-name" maxlength="80"></label>
        <label>Last name<input name="lastName" autocomplete="family-name" maxlength="80"></label>
        <label>Phone<input name="phone" type="tel" autocomplete="tel" maxlength="30"></label>
      </div>
      <label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label>
      <p class="muted">Use at least 12 characters. Staff use the same sign-in form.</p>
      <button id="submitAuth" class="primary" type="submit">Sign in</button>
      <button id="toggleRegistration" type="button">Create a passenger account</button>
    </form>
  </dialog>
</body>
</html>
