events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=100r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=auth_clients:10m;
    limit_conn_status 429;
    # Service discovery: container replacement must not leave the gateway using an old IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream passenger { zone passenger 64k; server passenger-service:8081 resolve; }
    upstream transport { zone transport 64k; server transport-service:8082 resolve; }
    upstream ticketing { zone ticketing 64k; server ticketing-service:8083 resolve; }
    upstream payment { zone payment 64k; server payment-service:8084 resolve; }
    upstream notification { zone notification 64k; server notification-service:8085 resolve; }
    upstream admin { zone admin 64k; server admin-service:8086 resolve; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 16k;
        client_body_timeout 10s;
        send_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        error_page 502 504 = @unavailable;
        location @too_large { default_type application/json; return 413 '{"error":{"code":"413","message":"Request body exceeds 16 KiB."}}'; }
        location @rate_limited { default_type application/json; return 429 '{"error":{"code":"429","message":"Too many requests. Try again shortly."}}'; }
        location @unavailable { default_type application/json; return 503 '{"error":{"code":"503","message":"The service is starting or unavailable. Try again."}}'; }
        location ~ ^/api/v1/(passenger|admin)/(login|register)/?$ {
            limit_conn auth_clients 2;
            limit_req zone=auth burst=50 nodelay;
            set $backend $1;
            proxy_pass http://$backend$request_uri;
        }
        location /api/v1/passenger/ { limit_req zone=api burst=100 nodelay; proxy_pass http://passenger; }
        location /api/v1/transport/ { limit_req zone=api burst=100 nodelay; proxy_pass http://transport; }
        location /api/v1/ticketing/ { limit_req zone=api burst=100 nodelay; proxy_pass http://ticketing; }
        location /api/v1/payment/ { limit_req zone=api burst=100 nodelay; proxy_pass http://payment; }
        location /api/v1/notification/ { limit_req zone=api burst=100 nodelay; proxy_pass http://notification; }
        location /api/v1/admin/ { limit_req zone=api burst=100 nodelay; proxy_pass http://admin; }
        location / { try_files $uri $uri/ =404; }
    }
}
