services:
  # Infrastructure Services
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: ticketing-zookeeper
    ports:
      - "22181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ticketing-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: ticketing-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - ticketing-network

  mongodb:
    image: mongo:6.0
    container_name: ticketing-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ticketing_platform
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - ticketing-network

  # Application Services
  passenger-service:
    build:
      context: ./passenger_service
      dockerfile: Dockerfile
    container_name: ticketing-passenger-service
    ports:
      - "8081:8080"
    depends_on:
      - mongodb
      - kafka
    environment:
      - mongoHost=mongodb
      - mongoPort=27017
      - databaseName=ticketing_platform
      - kafkaBootstrapServers=kafka:9092
    networks:
      - ticketing-network

  transport-service:
    build:
      context: ./transport_service
      dockerfile: Dockerfile
    container_name: ticketing-transport-service
    ports:
      - "8082:8081"
    depends_on:
      - mongodb
      - kafka
    environment:
      - mongoHost=mongodb
      - mongoPort=27017
      - databaseName=ticketing_platform
      - kafkaBootstrapServers=kafka:9092
    networks:
      - ticketing-network

  ticketing-service:
    build:
      context: ./ticketing_service
      dockerfile: Dockerfile
    container_name: ticketing-ticketing-service
    ports:
      - "8083:8083"
    depends_on:
      - mongodb
      - kafka
    environment:
      - mongoHost=mongodb
      - mongoPort=27017
      - databaseName=ticketing_platform
      - kafkaBootstrapServers=kafka:9092
    networks:
      - ticketing-network

  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile
    container_name: ticketing-payment-service
    ports:
      - "8084:8084"
    depends_on:
      - mongodb
      - kafka
    environment:
      - mongoHost=mongodb
      - mongoPort=27017
      - databaseName=ticketing_platform
      - kafkaBootstrapServers=kafka:9092
    networks:
      - ticketing-network

  notification-service:
    build:
      context: ./notification_service
      dockerfile: Dockerfile
    container_name: ticketing-notification-service
    ports:
      - "8085:8085"
    depends_on:
      - mongodb
      - kafka
    environment:
      - mongoHost=mongodb
      - mongoPort=27017
      - databaseName=ticketing_platform
      - kafkaBootstrapServers=kafka:9092
    networks:
      - ticketing-network

  admin-service:
    build:
      context: ./admin_service
      dockerfile: Dockerfile
    container_name: ticketing-admin-service
    ports:
      - "8086:8086"
    depends_on:
      - mongodb
      - kafka
    environment:
      - mongoHost=mongodb
      - mongoPort=27017
      - databaseName=ticketing_platform
      - kafkaBootstrapServers=kafka:9092
    networks:
      - ticketing-network

  # Kafka Management UI (Optional)
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ticketing-kafka-ui
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - ticketing-network

networks:
  ticketing-network:
    driver: bridge

volumes:
  mongodb_data: