name: uth-demo-v2

x-logging: &bounded-logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

x-application: &application
  restart: unless-stopped
  init: true
  mem_limit: 512m
  cpus: 1
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *bounded-logging
  healthcheck:
    test: [CMD-SHELL, 'wget -q -T 3 -O /dev/null "$$UTH_HEALTH_URL"']
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s
  environment: &application-environment
    BAL_CONFIG_VAR_UTH_CORE_MONGOURI: mongodb://uth_app:${MONGO_APP_PASSWORD:?Run uth.ps1 setup first}@mongodb:27017/uth_demo_v2?authSource=uth_demo_v2&replicaSet=rs0&serverSelectionTimeoutMS=5000
    BAL_CONFIG_VAR_UTH_CORE_DATABASENAME: uth_demo_v2
  depends_on:
    mongodb: {condition: service_healthy}

services:
  mongodb:
    logging: *bounded-logging
    image: uth-demo-v2-mongodb:local
    build: {context: ., dockerfile: deploy/mongodb.Dockerfile}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MONGO_INITDB_ROOT_USERNAME: uth_root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run uth.ps1 setup first}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run uth.ps1 setup first}
    entrypoint: ["/bin/bash", "-c", "cp /run/secrets/mongo-key /tmp/mongo-key && chmod 400 /tmp/mongo-key && chown mongodb:mongodb /tmp/mongo-key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-key"]
    volumes:
      - demo_mongodb_v2:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    secrets: [mongo-key]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username uth_root --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'try { rs.status() } catch(e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}) }; if (!db.hello().isWritablePrimary) quit(1)' >/dev/null
      interval: 10s
      timeout: 8s
      retries: 20

  kafka:
    logging: *bounded-logging
    image: uth-demo-v2-kafka:local
    build: {context: ., dockerfile: deploy/kafka.Dockerfile}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx384m -Xms128m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [demo_kafka_v2:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1]
      interval: 15s
      timeout: 10s
      retries: 20

  passenger-service:
    <<: *application
    environment:
      <<: *application-environment
      UTH_HEALTH_URL: http://127.0.0.1:8081/api/v1/passenger/health
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: passenger}}

  transport-service:
    <<: *application
    environment:
      <<: *application-environment
      UTH_HEALTH_URL: http://127.0.0.1:8082/api/v1/transport/health
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: transport}}

  ticketing-service:
    <<: *application
    environment:
      <<: *application-environment
      UTH_HEALTH_URL: http://127.0.0.1:8083/api/v1/ticketing/health
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: ticketing}}

  payment-service:
    <<: *application
    environment:
      <<: *application-environment
      UTH_HEALTH_URL: http://127.0.0.1:8084/api/v1/payment/health
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: payment}}

  notification-service:
    <<: *application
    depends_on:
      mongodb: {condition: service_healthy}
      kafka: {condition: service_healthy}
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: notification}}
    environment:
      <<: *application-environment
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:9092
      UTH_HEALTH_URL: http://127.0.0.1:8085/api/v1/notification/health

  admin-service:
    <<: *application
    build: {context: ., dockerfile: deploy/Dockerfile, args: {SERVICE: admin}}
    environment:
      <<: *application-environment
      BAL_CONFIG_VAR_UTH_CORE_BOOTSTRAPEMAIL: ${UTH_ADMIN_EMAIL:?Run uth.ps1 setup first}
      BAL_CONFIG_VAR_UTH_CORE_BOOTSTRAPPASSWORD: ${UTH_ADMIN_PASSWORD:?Run uth.ps1 setup first}
      UTH_HEALTH_URL: http://127.0.0.1:8086/api/v1/admin/health

  gateway:
    logging: *bounded-logging
    image: uth-demo-v2-gateway:local
    build: {context: ., dockerfile: deploy/gateway.Dockerfile}
    restart: unless-stopped
    mem_limit: 64m
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      passenger-service: {condition: service_healthy}
      transport-service: {condition: service_healthy}
      ticketing-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      admin-service: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, wget -q -T 3 -O /dev/null http://127.0.0.1:8080/api/v1/transport/health]
      interval: 10s
      timeout: 5s
      retries: 6

secrets:
  mongo-key:
    file: ./.runtime/mongo-key

volumes:
  demo_mongodb_v2:
  demo_kafka_v2:
